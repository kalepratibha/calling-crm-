plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wealthfund.crmdialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.wealthfund.crmdialer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// no external libraries on purpose: nothing extra to download
dependencies { }
